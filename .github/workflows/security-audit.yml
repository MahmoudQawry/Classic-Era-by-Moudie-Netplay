concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true
name: Security audit

on:
  pull_request:
  push:
    branches: [main, security-legal-hardening-2026]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      # Release gate: only production dependencies are shipped by the backend/runtime.
      - run: pnpm audit --prod --audit-level=high
      # Keep the complete dependency audit visible without blocking on dev-tooling advisories.
      - name: Full dependency audit report
        run: pnpm audit --audit-level=high > audit-full.txt 2>&1 || true
      - name: Upload full dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: full-dependency-audit
          path: audit-full.txt
          retention-days: 7
