name: Android Build Zero Counter

on:
  push:
    branches: [main, release/deep-hardening-2026-09-26]
  pull_request:
    branches: [main]
  workflow_dispatch:
run-name: Android Build Zero Counter
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Never bake a stale hosting URL into the APK. Configure repository variables
      # to point at the live, reserved NetPlay service.
      EXPO_PUBLIC_NETPLAY_SERVICE_URL: ${{ vars.NETPLAY_SERVICE_URL || 'https://classic-era-by-moudie-netplay.moudienetplay.workers.dev' }}
      EXPO_PUBLIC_NETPLAY_SERVICE_URLS: ${{ vars.NETPLAY_SERVICE_URLS || 'https://classic-era-by-moudie-netplay.moudienetplay.workers.dev' }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL || vars.NETPLAY_SERVICE_URL || 'https://classic-era-by-moudie-netplay.moudienetplay.workers.dev' }}
      EXPO_PUBLIC_TURN_URL: ${{ vars.TURN_URL }}
      EXPO_PUBLIC_TURN_USERNAME: ${{ vars.TURN_USERNAME }}
      EXPO_PUBLIC_TURN_CREDENTIAL: ${{ vars.TURN_CREDENTIAL }}
      EXPO_PUBLIC_LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
    steps:
      - name: 📥 جلب الكود
        uses: actions/checkout@v4
      - name: ⚙️ تثبيت Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 📦 تثبيت pnpm
        uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - name: 📥 تثبيت الحزم
        run: pnpm install --no-frozen-lockfile
      - name: 🔧 تطبيق أنواع الأنظمة الستة
        run: python3 scripts/patch-six-system-types.py
      - name: 🧪 فحص TypeScript
        id: typecheck
        run: |
          set +e
          pnpm check 2>&1 | tee ts-check.log
          code=${PIPESTATUS[0]}
          echo "$code" > ts-check.exit
          exit 0
      - name: 📎 عرض تشخيص TypeScript في سجل البناء
        if: always()
        run: |
          if [ -f ts-check.log ]; then
            cat ts-check.log
          fi
      - name: 🛑 رفض البناء عند فشل TypeScript
        run: test "$(cat ts-check.exit)" = "0"
      - name: 🧹 تنظيف آمن قبل الاختبارات والبناء
        run: pnpm cleanup -- --apply
      - name: 🧪 تشغيل الاختبارات
        run: pnpm test
      - name: 🖐️ تثبيت نظام التحكم الحقيقي متعدد الأصابع
        run: |
          python3 scripts/apply-native-multitouch-fix.py
          python3 scripts/restore-connected-dpad-routing.py
          python3 scripts/apply-universal-connected-dpad.py
          python3 scripts/apply-famicom-connected-dpad.py
          python3 scripts/fix-router-types.py
      - name: 🤖 تثبيت Java 17
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: 🎮 تضمين أنوية المحاكيات الستة في الـ APK
        run: |
          chmod +x scripts/sync-libretro-cores.sh
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            ./scripts/sync-libretro-cores.sh "$ABI"
          done
          python3 scripts/patch-six-core-catalog.py
          python3 scripts/patch-emulator-runtime.py
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            for CORE in fceumm pcsx_rearmed ppsspp genesis_plus_gx parallel_n64 play; do
              test -s "modules/moudie-emulator/android/src/main/jniLibs/${ABI}/${CORE}_libretro_android.so"
            done
          done
          grep -q '"n64"' modules/moudie-emulator/android/src/main/java/expo/modules/moudieemulator/NativeCoreCatalog.kt
          grep -q '"ps2"' modules/moudie-emulator/android/src/main/java/expo/modules/moudieemulator/NativeCoreCatalog.kt
          grep -q 'System.currentTimeMillis()' modules/moudie-emulator/android/src/main/java/expo/modules/moudieemulator/UniversalLibretroPlayerActivity.kt
          grep -q 'localDevicePorts' modules/moudie-emulator/android/src/main/java/expo/modules/moudieemulator/UniversalLibretroPlayerActivity.kt
          grep -q 'n64' app/local-play.tsx
          grep -q 'ps2' app/local-play.tsx
          grep -q 'n64' 'app/library/[system].tsx'
          grep -q 'ps2' 'app/library/[system].tsx'
          grep -q 'n64' 'app/native/[system]/[roomId].tsx'
          grep -q 'ps2' 'app/native/[system]/[roomId].tsx'
      - name: 🌐 فحص إعدادات الخدمة
        run: |
          if [ -z "${EXPO_PUBLIC_NETPLAY_SERVICE_URL}" ] && [ -z "${EXPO_PUBLIC_NETPLAY_SERVICE_URLS}" ] && [ -z "${EXPO_PUBLIC_API_BASE_URL}" ]; then
            echo "ERROR: No realtime service URL is configured. Refusing to produce an online-play APK without a live NetPlay service."
            exit 1
          fi
          echo "Realtime service origin configured."
          PRIMARY="${EXPO_PUBLIC_NETPLAY_SERVICE_URL:-${EXPO_PUBLIC_API_BASE_URL:-${EXPO_PUBLIC_NETPLAY_SERVICE_URLS%%,*}}}"
          echo "Checking configured realtime service health: ${PRIMARY}/api/health"
          curl --fail --silent --show-error --max-time 10 "${PRIMARY}/api/health" | grep -q '"ok":true'
          echo "Configured realtime service health check passed."

      - name: 🧪 اختبار خادم الغرف محلياً قبل بناء Android
        run: |
          set -e
          rm -rf dist
          pnpm build
          PORT=4100 NODE_ENV=production node dist/index.js >/tmp/moudie-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4100/api/health | grep -q '"ok":true'; then
              echo "Room service health check passed."
              exit 0
            fi
            sleep 1
          done
          echo "Room service failed to start or /api/health is unavailable."
          cat /tmp/moudie-server.log
          exit 1
      - name: 🧩 إصلاح سلامة أيقونة PNG قبل Expo prebuild
        run: python3 scripts/repair-png-crc.py assets/images/classic-era-new-icon.png
      - name: 🔧 Prebuild Android
        run: npx expo prebuild --platform android
      - name: 🛡️ استعادة مسار الإقلاع العادي
        run: python3 scripts/restore-plain-android-startup.py
      - name: 🔨 إصلاح صلاحيات Gradle
        run: chmod +x android/gradlew
      - name: 🔐 إنشاء مفتاح توقيع مؤقت لـCI فقط
        run: |
          set -e
          keytool -genkeypair -v -keystore /tmp/moudie-ci-release.keystore -storepass ci-only-change-me -alias moudie-ci -keypass ci-only-change-me -keyalg RSA -keysize 4096 -validity 2 -dname "CN=Classic Era CI, OU=Moudie, O=Moudie Netplay, C=AE"
          echo "MOUDIE_RELEASE_STORE_FILE=/tmp/moudie-ci-release.keystore" >> "$GITHUB_ENV"
          echo "MOUDIE_RELEASE_STORE_PASSWORD=ci-only-change-me" >> "$GITHUB_ENV"
          echo "MOUDIE_RELEASE_KEY_ALIAS=moudie-ci" >> "$GITHUB_ENV"
          echo "MOUDIE_RELEASE_KEY_PASSWORD=ci-only-change-me" >> "$GITHUB_ENV"
      - name: 🩺 فحص ترجمة Kotlin قبل البناء الكامل
        id: kotlincheck
        run: |
          set -o pipefail
          cd android
          ./gradlew :moudie-emulator:compileReleaseKotlin :app:compileReleaseKotlin --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" 2>&1 | tee /tmp/gradle-build.log
      - name: 🏗️ بناء APK مستقل (Release)
        id: gradle
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" -Dorg.gradle.daemon=false 2>&1 | tee -a /tmp/gradle-build.log
      - name: 🧾 نشر تشخيص فشل البناء في تذكرة قابلة للقراءة
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          LOG=/tmp/gradle-build.log
          test -f "$LOG" || LOG=/dev/null
          TITLE="Android build diagnostics auto"
          BODY=/tmp/build-diagnostics.md
          {
            echo "### فشل بناء Android"
            echo ""
            echo "- run: \`$GITHUB_RUN_ID\`"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- workflow step: \`${{ steps.gradle.outcome || steps.kotlincheck.outcome }}\`"
            echo ""
            echo '```'
            grep -nE '^(e: |w: .*(error|Error)|> Task .*FAILED|FAILURE:|Execution failed|Caused by:)|\.kt: ?\(|error:' "$LOG" | head -120
            echo '```'
            echo ""
            echo "آخر 60 سطراً من سجل Gradle:"
            echo ""
            echo '```'
            tail -60 "$LOG"
            echo '```'
          } > "$BODY"
          NUMBER=$(gh issue list --state open --search "in:title $TITLE" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file "$BODY" || true
          else
            gh issue create --title "$TITLE" --body-file "$BODY" || true
          fi
      - name: 🚫 فحص الكلمات والعناوين المحظورة من APK
        run: |
          set -e
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if strings "$APK" | grep -Eiq 'manus|pubg|moudienet-7h7tawv'; then
            echo "ERROR: forbidden provider/game branding or stale relay URL detected inside APK."
            exit 1
          fi
          echo "Forbidden branding/stale relay scan passed."

      - name: 🔬 تدقيق جسر Play! داخل APK
        run: |
          set -e
          APK="android/app/build/outputs/apk/release/app-release.apk"
          rm -rf /tmp/moudie-apk-check
          mkdir -p /tmp/moudie-apk-check
          unzip -q "$APK" 'lib/*' -d /tmp/moudie-apk-check
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "/tmp/moudie-apk-check/lib/${ABI}/libmoudie_play_bridge.so"
            test -s "/tmp/moudie-apk-check/lib/${ABI}/play_libretro_android.so"
            readelf -Ws "/tmp/moudie-apk-check/lib/${ABI}/libmoudie_play_bridge.so" | grep -q 'Java_expo_modules_moudieemulator_UniversalLibretroPlayerActivity_nativeInitializePlayJavaVm'
            readelf -Ws "/tmp/moudie-apk-check/lib/${ABI}/play_libretro_android.so" | grep -q '_ZN9Framework7CJavaVM9SetJavaVMEP7_JavaVM'
          done
          echo "Play! core contains the required CJavaVM::SetJavaVM symbol; runtime bootstrap is verified by the patched Play! source and build script."
      - name: ✅ التحقق من دعم أندرويد 8 حتى الأحدث داخل ملف APK نفسه
        run: |
          set -e
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAPT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt2 was not found, cannot verify the built package."
            exit 1
          fi
          echo "Using: $AAPT"
          "$AAPT" dump badging "$APK" > /tmp/apk-badging.txt
          head -3 /tmp/apk-badging.txt
          MINSDK=$(grep -oE "sdkVersion:'[0-9]+'" /tmp/apk-badging.txt | grep -oE "[0-9]+" | head -1)
          TARGETSDK=$(grep -oE "targetSdkVersion:'[0-9]+'" /tmp/apk-badging.txt | grep -oE "[0-9]+" | head -1)
          VERSIONCODE=$(grep -oE "versionCode='[0-9]+'" /tmp/apk-badging.txt | grep -oE "[0-9]+" | head -1)
          VERSIONNAME=$(grep -oE "versionName='[^']+'" /tmp/apk-badging.txt | head -1)
          echo "Package check: minSdk=$MINSDK targetSdk=$TARGETSDK versionCode=$VERSIONCODE $VERSIONNAME"
          test "$MINSDK" = "26" || { echo "ERROR: minSdkVersion must be 26 so Android 8.0 can install the package."; exit 1; }
          test "$TARGETSDK" -ge 35 || { echo "ERROR: targetSdkVersion is too old for current Android releases."; exit 1; }
          test "$VERSIONCODE" -ge 2 || { echo "ERROR: versionCode must be at least 2 for this update."; exit 1; }
          grep -q "largeHeap='true'" /tmp/apk-badging.txt || echo "NOTE: largeHeap is declared in the manifest source; aapt2 badging may not list it."
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -q "$ABI" /tmp/apk-badging.txt || { echo "ERROR: missing native code for $ABI"; exit 1; }
          done
          echo "Package verification passed: Android 8.0 (API 26) through the current release."

      - name: 📦 نشر APK كإصدار اختبار قابل للتنزيل
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="android-test-latest"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BUILD_NO=$((GITHUB_RUN_NUMBER - 1))
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Classic Era by Moudie — Android Build $BUILD_NO" --notes "Automated verified Android APK build from commit $GITHUB_SHA." --prerelease --target "$GITHUB_SHA"
          fi
          echo "APK release: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
