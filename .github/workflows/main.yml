name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_NETPLAY_SERVICE_URL: ${{ vars.NETPLAY_SERVICE_URL }}
      EXPO_PUBLIC_NETPLAY_SERVICE_URLS: ${{ vars.NETPLAY_SERVICE_URLS }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
      EXPO_PUBLIC_TURN_URL: ${{ vars.TURN_URL }}
      EXPO_PUBLIC_TURN_USERNAME: ${{ vars.TURN_USERNAME }}
      EXPO_PUBLIC_TURN_CREDENTIAL: ${{ vars.TURN_CREDENTIAL }}
      EXPO_PUBLIC_LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
    steps:
      - name: 📥 جلب الكود
        uses: actions/checkout@v4
      - name: ⚙️ تثبيت Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 📦 تثبيت pnpm
        uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - name: 📥 تثبيت الحزم
        run: pnpm install --no-frozen-lockfile
      - name: 🔧 تطبيق أنواع الأنظمة الستة
        run: python3 scripts/patch-six-system-types.py
      - name: 🧪 فحص TypeScript
        id: typecheck
        run: |
          set +e
          pnpm check 2>&1 | tee ts-check.log
          code=${PIPESTATUS[0]}
          echo "$code" > ts-check.exit
          exit 0
      - name: 📎 حفظ تشخيص TypeScript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-check-diagnostics
          path: |
            ts-check.log
            ts-check.exit
          if-no-files-found: error
      - name: 🛑 رفض البناء عند فشل TypeScript
        run: test "$(cat ts-check.exit)" = "0"
      - name: 🧪 تشغيل الاختبارات
        run: pnpm test
      - name: 🖐️ تثبيت نظام التحكم الحقيقي متعدد الأصابع
        run: |
          python3 scripts/apply-native-multitouch-fix.py
          python3 scripts/restore-connected-dpad-routing.py
          python3 scripts/apply-universal-connected-dpad.py
          python3 scripts/apply-famicom-connected-dpad.py
          python3 scripts/fix-router-types.py
      - name: 🤖 تثبيت Java 17
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: 🎮 تضمين أنوية المحاكيات الستة في الـ APK
        run: |
          chmod +x scripts/sync-libretro-cores.sh
          ./scripts/sync-libretro-cores.sh arm64-v8a
          python3 scripts/patch-six-core-catalog.py
          python3 scripts/patch-emulator-runtime.py
          test -s modules/moudie-emulator/android/src/main/jniLibs/arm64-v8a/fceumm_libretro_android.so
          test -s modules/moudie-emulator/android/src/main/jniLibs/arm64-v8a/pcsx_rearmed_libretro_android.so
          test -s modules/moudie-emulator/android/src/main/jniLibs/arm64-v8a/ppsspp_libretro_android.so
          test -s modules/moudie-emulator/android/src/main/jniLibs/arm64-v8a/genesis_plus_gx_libretro_android.so
          test -s modules/moudie-emulator/android/src/main/jniLibs/arm64-v8a/parallel_n64_libretro_android.so
          test -s modules/moudie-emulator/android/src/main/jniLibs/arm64-v8a/play_libretro_android.so
          grep -q '"n64"' modules/moudie-emulator/android/src/main/java/expo/modules/moudieemulator/NativeCoreCatalog.kt
          grep -q '"ps2"' modules/moudie-emulator/android/src/main/java/expo/modules/moudieemulator/NativeCoreCatalog.kt
          grep -q 'System.currentTimeMillis()' modules/moudie-emulator/android/src/main/java/expo/modules/moudieemulator/UniversalLibretroPlayerActivity.kt
          grep -q 'localDevicePorts' modules/moudie-emulator/android/src/main/java/expo/modules/moudieemulator/UniversalLibretroPlayerActivity.kt
          grep -q 'n64' app/local-play.tsx
          grep -q 'ps2' app/local-play.tsx
          grep -q 'n64' 'app/library/[system].tsx'
          grep -q 'ps2' 'app/library/[system].tsx'
          grep -q 'n64' 'app/native/[system]/[roomId].tsx'
          grep -q 'ps2' 'app/native/[system]/[roomId].tsx'
      - name: 🌐 فحص إعدادات الخدمة بدون منع بناء نسخة الاختبار
        run: |
          if [ -z "${EXPO_PUBLIC_NETPLAY_SERVICE_URL}" ] && [ -z "${EXPO_PUBLIC_NETPLAY_SERVICE_URLS}" ] && [ -z "${EXPO_PUBLIC_API_BASE_URL}" ]; then
            echo "WARNING: No realtime service URL is configured. This APK remains valid for local emulator testing, but online rooms cannot connect until a reachable service origin is configured."
          else
            echo "Realtime service origin configured."
          fi
      - name: 🔧 Prebuild Android
        run: npx expo prebuild --platform android
      - name: 🛡️ استعادة مسار الإقلاع العادي
        run: python3 scripts/restore-plain-android-startup.py
      - name: 🔨 إصلاح صلاحيات Gradle
        run: chmod +x android/gradlew
      - name: 🏗️ بناء APK مستقل (Release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" -Dorg.gradle.daemon=false
      - name: 🔬 تدقيق جسر Play! داخل APK
        run: |
          set -e
          APK="android/app/build/outputs/apk/release/app-release.apk"
          rm -rf /tmp/moudie-apk-check
          mkdir -p /tmp/moudie-apk-check
          unzip -q "$APK" 'lib/arm64-v8a/*' -d /tmp/moudie-apk-check
          test -s /tmp/moudie-apk-check/lib/arm64-v8a/libmoudie_play_bridge.so
          test -s /tmp/moudie-apk-check/lib/arm64-v8a/play_libretro_android.so
          readelf -Ws /tmp/moudie-apk-check/lib/arm64-v8a/libmoudie_play_bridge.so | grep -q 'Java_expo_modules_moudieemulator_UniversalLibretroPlayerActivity_nativeInitializePlayJavaVm'
          readelf -Ws /tmp/moudie-apk-check/lib/arm64-v8a/play_libretro_android.so | grep -q '_ZN9Framework7CJavaVM9SetJavaVMEP7_JavaVM'
          echo "Play! JNI bridge and target setter symbol are present in the release APK."
      - name: 📤 رفع APK المستقل
        uses: actions/upload-artifact@v4
        with:
          name: classic-era-moudie-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
