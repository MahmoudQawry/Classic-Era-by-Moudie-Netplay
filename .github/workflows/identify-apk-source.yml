name: Identify approved APK source (temporary)

on:
  push:
    branches: [arena/01a0e928-classic-era-by-moudie-netplay]
    paths: [.github/workflows/identify-apk-source.yml, .github/scripts/**]

permissions:
  contents: write

jobs:
  identify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch every branch and pull-request head
        run: |
          git fetch -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*/head:refs/remotes/pr/*'
      - name: Download approved APK (read-only)
        run: |
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/595870907" > /tmp/approved.apk
          ls -l /tmp/approved.apk
      - name: Install TypeScript parser
        run: mkdir -p /tmp/tsx && cd /tmp/tsx && npm i -s typescript@5
      - name: Rank candidate commits
        env:
          TS_PATH: /tmp/tsx/node_modules/typescript
        run: python3 .github/scripts/identify_apk_source.py /tmp/approved.apk /tmp/result.json
      - name: Store result in a private draft
        run: |
          gh release create "apk-source-id-${GITHUB_RUN_ID}" --draft \
            --title "APK source identification ${GITHUB_RUN_ID} — not published" \
            --notes-file /tmp/result.json --target "$GITHUB_SHA"
