name: Inspect archived Android APK

on:
  push:
    branches: [arena/01a0e8c3-classic-era-by-moudie-netplay]
    paths: [.github/workflows/inspect-archived-apk.yml]

# Recovery inspection only: no checkout, rebuilding, deployment or publication.
permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: '10733005946'
            run: '35818573034'
            commit: e83972b66bad49a42e07bf8b195f4cc288cf5154
          - artifact: '10731220343'
            run: '35813919796'
            commit: 2e9cbbe7dd619e21265a4318182480d4c1b43b20
          - artifact: '10610098834'
            run: '35528494745'
            commit: 6455c4641e88c00e0c4e94f27f1e799fcdb6cef1
    steps:
      - name: Download preserved pre-hardening build
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ matrix.artifact }}
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/archived-apk
      - name: Inspect archived APK without executing it
        env:
          ARCHIVE_DIR: ${{ runner.temp }}/archived-apk
          SOURCE_COMMIT: ${{ matrix.commit }}
          SOURCE_RUN: ${{ matrix.run }}
          ARTIFACT_ID: ${{ matrix.artifact }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          root = Path(os.environ['ARCHIVE_DIR'])
          apks = list(root.rglob('*.apk'))
          assert len(apks) == 1, 'Unexpected artifact contents'
          apk = apks[0]
          size = apk.stat().st_size
          with apk.open('rb') as stream:
              sha = hashlib.file_digest(stream, 'sha256').hexdigest()
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None, 'Corrupt APK ZIP'
              libs = sorted(n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so'))
              abis = sorted({n.split('/')[1] for n in libs})
              cores = sorted(Path(n).name for n in libs if '_libretro_android.so' in n)
          report = {
              'source_commit': os.environ['SOURCE_COMMIT'],
              'source_run': int(os.environ['SOURCE_RUN']),
              'artifact_id': int(os.environ['ARTIFACT_ID']),
              'bytes': size,
              'MiB': round(size / 1048576, 3),
              'sha256': sha,
              'abis': abis,
              'cores': cores,
          }
          print('::notice title=Verified archived APK::' + json.dumps(report))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Verified archived APK\n\n```json\n' + json.dumps(report, indent=2) + '\n```\n')
          PY
