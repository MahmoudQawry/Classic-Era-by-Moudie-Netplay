# Persistent low-latency realtime host. Supply secrets through the host environment.
port: 7880
bind_addresses:
  - 0.0.0.0

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
  # Mobile networks and restrictive Wi-Fi can block UDP. Keep a TCP/TLS-capable
  # fallback so audio can recover instead of silently losing the media path.
  allow_tcp_fallback: true
  tcp_fallback_rtt_threshold: 250
  allow_udp_unstable_fallback: true

redis:
  address: 127.0.0.1:6379
  password: ${REDIS_PASSWORD}

logging:
  level: info

room:
  auto_create: true
